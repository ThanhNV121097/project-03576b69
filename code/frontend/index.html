<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loop Audio — headphones, speakers and audio accessories</title>
    <meta name="description" content="A small San Francisco shop for headphones, speakers and the accessories that keep them working. Free US shipping over $75, thirty days to return, two years of warranty." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Loop Audio — headphones, speakers and audio accessories" />
    <meta property="og:description" content="Twelve things we can stand behind, two own ranges, and a room on Folsom Street where you can listen to all of them." />
    <meta property="og:image" content="/images/studio-wide.jpg" />
    <script>
      // Light or dark, before the first paint so the page never flashes the
      // other mode: the visitor's stored choice (src/components/ThemeToggle.tsx),
      // else the site's default (content.json site.defaultMode, written onto
      // the html element as data-default-mode by vite.config.ts), else
      // nothing — the visitor's own system setting.
      (function () {
        var d = document.documentElement, t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = d.getAttribute("data-default-mode");
        if (t === "light" || t === "dark") d.dataset.theme = t;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400..800&family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
